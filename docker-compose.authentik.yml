version: '3.8'

services:
  # Authentik Identity Provider
  authentik:
    image: ghcr.io/goauthentik/server:2025.8.3
    container_name: slfn-authentik
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@slfn.local
      AUTHENTIK_BOOTSTRAP_PASSWORD: slfn-admin-pass
      AUTHENTIK_BOOTSTRAP_TOKEN: slfn-bootstrap-token
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-this-in-production}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: info
      # Database
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik-pass
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Email (configure for production)
      AUTHENTIK_EMAIL__HOST: localhost
      AUTHENTIK_EMAIL__PORT: 25
      AUTHENTIK_EMAIL__USERNAME: ""
      AUTHENTIK_EMAIL__PASSWORD: ""
      AUTHENTIK_EMAIL__USE_TLS: "false"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_EMAIL__FROM: "noreply@slfn.local"
    ports:
      - "9000:9000"
      - "9443:9443"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Authentik Worker
  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.8.3
    container_name: slfn-authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@slfn.local
      AUTHENTIK_BOOTSTRAP_PASSWORD: slfn-admin-pass
      AUTHENTIK_BOOTSTRAP_TOKEN: slfn-bootstrap-token
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-this-in-production}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: info
      # Database
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik-pass
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      authentik:
        condition: service_healthy
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates

  # PostgreSQL for Authentik (shared with Business OS)
  db:
    image: postgres:15-alpine
    container_name: slfn-authentik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik-pass
      POSTGRES_DB: authentik
    volumes:
      - authentik_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Authentik (shared with Business OS)
  redis:
    image: redis:7-alpine
    container_name: slfn-authentik-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - authentik_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  authentik_db_data:
  authentik_redis_data:
  authentik_media:
  authentik_templates: