version: '3.8'

services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: hl-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hl_user
      POSTGRES_PASSWORD: hl_pass
      POSTGRES_DB: hl_nexus
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hl_user -d hl_nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: hl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hl-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://hl_user:hl_pass@db:5432/hl_nexus
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-this-in-production
      - ALCHEMY_KEY=sk-ant-apikey-placeholder
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    command: npm run dev -- --host 0.0.0.0 --port 3000

  # AI Service (optional - for local LLM)
  ai-service:
    image: ollama/ollama:latest
    container_name: hl-ai
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # Uncomment if using GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: hl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

  # Nginx (reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: hl-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/certs:/etc/nginx/certs
    environment:
      - NGINX_HOST=localhost

volumes:
  db_data:
  redis_data:
  ollama_data:
  minio_data: