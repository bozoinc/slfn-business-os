version: '3.8'

services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: slfn-business-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: slfn
      POSTGRES_PASSWORD: slfn-pass
      POSTGRES_DB: slfn_business_os
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slfn -d slfn_business_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: slfn-business-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend API - REMAPPED to 8081 to avoid conflict with llama-server (8000) and SLFN Nexus AI (8102/8103)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: slfn-business-os-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://slfn:***@db:5432/slfn_business_os
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-this-in-production
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8081:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend - REMAPPED to 3002 to avoid conflict
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: slfn-business-os-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8081
    ports:
      - "3002:3000"
    command: npm run dev -- --host 0.0.0.0 --port 3000

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: slfn-business-os-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

  # Nginx (reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: slfn-business-os-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "8082:80"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/certs:/etc/nginx/certs
    environment:
      - NGINX_HOST=localhost

volumes:
  db_data:
  redis_data:
  minio_data: